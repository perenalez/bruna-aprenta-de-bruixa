<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Bruna · La llamada del torreón</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#40398f;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#3b2c2a;-webkit-user-select:none;user-select:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ui{position:fixed;z-index:5}
#top{left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 12px) 14px 0;pointer-events:none}
#title{line-height:1.15}
#title b{font-size:20px;letter-spacing:.3px;color:#ff8fa0}
#title small{display:block;font-size:11px;color:#e9dcec;opacity:.8;margin-top:2px}
#hint{left:50%;top:calc(env(safe-area-inset-top) + 62px);transform:translateX(-50%);background:rgba(255,255,255,.82);padding:7px 14px;border-radius:999px;font-size:12px;pointer-events:none;transition:opacity .8s;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
#joy{left:calc(env(safe-area-inset-left) + 22px);bottom:calc(env(safe-area-inset-bottom) + 28px);width:132px;height:132px;border-radius:50%;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.55);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 2px 8px rgba(0,0,0,.3);pointer-events:none}
#acts{right:calc(env(safe-area-inset-right) + 22px);bottom:calc(env(safe-area-inset-bottom) + 28px);display:flex;align-items:flex-end;gap:12px}
.rb{border:0;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 2px 8px rgba(0,0,0,.3);font:700 13px system-ui;color:#3b2c2a;cursor:pointer;touch-action:manipulation}
.rb:active{transform:scale(.94);background:#fff}
#bjump{width:88px;height:88px}
#bwave{width:58px;height:58px;margin-bottom:4px}
#ctx{left:0;top:0;display:none;gap:8px;align-items:center;flex-direction:column;will-change:transform}
#ctx .row{display:flex;gap:8px}
#ctx .cap{font:600 11px system-ui;color:#fff;background:rgba(30,20,36,.7);padding:3px 9px;border-radius:999px;white-space:nowrap}
#ctx button{border:0;border-radius:12px;background:#fff8e6;color:#8a2337;font:800 15px system-ui;padding:10px 16px;box-shadow:0 3px 0 #b9975a,0 6px 14px rgba(0,0,0,.4);cursor:pointer;touch-action:manipulation;white-space:nowrap}
#ctx button:active{transform:translateY(2px);box-shadow:0 1px 0 #b9975a}
#ctx button.hot{background:#ffe14d;color:#7a2a12;animation:pl .35s infinite alternate}@keyframes pl{to{transform:scale(1.12)}}
#ctx button.alt{background:#efe3ff;color:#5b2d8a;box-shadow:0 3px 0 #9d86bd,0 6px 14px rgba(0,0,0,.4)}
#read{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(15,10,20,.74);padding:16px}
#read.on{display:flex}
#spread{display:flex;width:min(94vw,580px);min-height:min(60vh,330px);background:#f3e2b3;border:7px solid #6d3b2e;border-radius:8px;box-shadow:0 14px 40px rgba(0,0,0,.6);font-family:"Bradley Hand","Segoe Print","Marker Felt","Comic Sans MS",cursive;color:#4a2f22;animation:op .35s ease-out}
@keyframes op{from{transform:scaleX(.15);opacity:0}to{transform:none;opacity:1}}
.pg{flex:1;padding:18px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
.pg:first-child{box-shadow:inset -14px 0 16px -12px rgba(90,55,30,.55)}
.pg:last-child{box-shadow:inset 14px 0 16px -12px rgba(90,55,30,.55)}
.pg h2{margin:0;font-size:26px;letter-spacing:1px}
.pg h3{margin:0;font-size:15px;text-transform:uppercase;letter-spacing:2px;opacity:.7}
.pg ul{list-style:none;margin:0;padding:0;font-size:21px;line-height:1.7}
.pg svg{width:86px;height:86px;stroke:#4a2f22;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
#closeRead{border:0;border-radius:999px;background:#fff8e6;color:#8a2337;font:800 15px system-ui;padding:11px 26px;box-shadow:0 3px 0 #b9975a;cursor:pointer}
body.cine #joy,body.cine #acts,body.cine #ctx,body.cine #hint,body.cine #top{display:none!important}
.bar{position:fixed;left:0;right:0;height:9vh;background:#000;z-index:8;transition:transform .8s;pointer-events:none}
#bt{top:0;transform:translateY(-100%)}#bb{bottom:0;transform:translateY(100%)}
body.cine #bt,body.cine #bb{transform:none}
#fade{position:fixed;inset:0;background:#07050c;z-index:9;opacity:1;transition:opacity 1.4s;pointer-events:none}
#cap{position:fixed;left:50%;bottom:calc(9vh + 18px);transform:translateX(-50%);z-index:10;width:min(92vw,620px);text-align:center;font:italic 600 19px/1.4 Georgia,"Times New Roman",serif;color:#fff3d6;text-shadow:0 2px 6px #000,0 0 18px rgba(255,170,60,.7);pointer-events:none;min-height:3em}
#emo{position:fixed;left:0;top:0;z-index:7;font:900 34px system-ui;color:#fff;background:#3b2c4a;border:3px solid #fff;border-radius:50%;width:52px;height:52px;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .2s;will-change:transform}
.card{position:fixed;inset:0;z-index:12;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;color:#fff3d6;padding:20px}
.card.on{display:flex}
.card h1{margin:0;font:700 30px/1.15 Georgia,serif;text-shadow:0 2px 12px #000}
.card p{margin:0;font:15px/1.4 system-ui;opacity:.85;max-width:420px}
.card button{border:0;border-radius:999px;background:#fff8e6;color:#8a2337;font:800 16px system-ui;padding:13px 26px;box-shadow:0 3px 0 #b9975a;cursor:pointer}
.card button.sec{background:rgba(255,255,255,.16);color:#fff;box-shadow:none;font-weight:600}
#skip{position:fixed;right:14px;top:calc(9vh + 10px);z-index:11;border:0;border-radius:999px;background:rgba(255,255,255,.18);color:#fff;font:600 12px system-ui;padding:7px 12px;display:none;cursor:pointer}
body.cine.play #skip{display:block}
</style>
</head>
<body class="cine">
<canvas id="c"></canvas>

<div id="bt" class="bar"></div><div id="bb" class="bar"></div><div id="fade"></div><div id="cap"></div><div id="emo"></div>
<button id="skip">Saltar animación</button>
<div id="startc" class="card on"><h1>La llamada del torreón</h1><p>Una animación corta con Bruna en el bosque.</p><button id="bstart">▶ Ver la animación</button></div>
<div id="endc" class="card"><h1>Continuará…</h1><button id="bagain">Verla otra vez</button><button id="bfree" class="sec">Explorar el bosque</button></div>
<div id="top" class="ui"><div id="title"><b>Bruna</b><small>El bosque del lago · <span id="cnt">prueba de decorado</span></small></div></div>
<div id="hint" class="ui">Acércate al unicornio o al lago · arrastra para girar la cámara</div>
<div id="ctx" class="ui"></div>

<div id="joy" class="ui"><div id="knob"></div></div>
<div id="acts" class="ui">
  <button id="bwave" class="rb">Saludar</button>
  <button id="bjump" class="rb">Saltar</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const wrapA=a=>{while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;return a;};
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const R=rng(23);
const rr=(a,b)=>a+(b-a)*R();
const pick=a=>a[Math.floor(R()*a.length)%a.length];

/* ---------- renderer / escena ---------- */
const canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
scene.background=new THREE.Color('#1a141f');
const camera=new THREE.PerspectiveCamera(38,1,0.1,200);

const toonGrad=(()=>{const d=new Uint8Array([150,205,255]);const t=new THREE.DataTexture(d,3,1,THREE.LuminanceFormat);t.minFilter=t.magFilter=THREE.NearestFilter;t.generateMipmaps=false;t.needsUpdate=true;return t;})();
const TOON=(c,o,flat)=>{const m=new THREE.MeshToonMaterial(Object.assign({color:c,gradientMap:toonGrad},o||{}));if(flat)m.flatShading=true;return m;};

const hemi=new THREE.HemisphereLight('#b9aee6','#8a6a4e',0.74);
scene.add(hemi);
const sun=new THREE.DirectionalLight('#dfe4ff',0.3);
sun.castShadow=true;
const mapSize=matchMedia('(pointer:coarse)').matches?1024:2048;
sun.shadow.mapSize.set(mapSize,mapSize);
Object.assign(sun.shadow.camera,{left:-6.5,right:6.5,top:6.5,bottom:-6.5,near:1,far:26});
sun.shadow.bias=-0.0007;sun.shadow.normalBias=0.04;
sun.position.set(-3,10,3.5);
scene.add(sun);scene.add(sun.target);

/* ---------- utilidades ---------- */
const mk=(geo,mat,x,y,z,parent)=>{const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=true;if(parent)parent.add(m);return m;};
function canvasTex(w,h,draw,rx,ry){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);t.anisotropy=4;return t;}
const dotsTex=canvasTex(128,128,(g,w,h)=>{g.fillStyle='#e8506a';g.fillRect(0,0,w,h);g.fillStyle='#3a2a3f';[[0,96],[128,96],[64,96],[32,32],[96,32]].forEach(([x,y])=>{g.beginPath();g.arc(x,y,11,0,7);g.fill();});},6,2.5);
const bowTex=canvasTex(64,64,(g,w,h)=>{g.fillStyle='#d9484a';g.fillRect(0,0,w,h);g.fillStyle='#5a1f2c';[[16,16],[48,48],[48,-4],[-4,48]].forEach(([x,y])=>{g.beginPath();g.arc(x,y,9,0,7);g.fill();});},2,2);
const stripe=(ry)=>canvasTex(8,64,(g,w,h)=>{g.fillStyle='#f3efe6';g.fillRect(0,0,w,h/2);g.fillStyle='#464a78';g.fillRect(0,h/2,w,h/2);},1,ry);
const SPH=(r,w,h)=>new THREE.SphereGeometry(r,w||20,h||14);
const prismG=(a,b,l)=>new THREE.CylinderGeometry(a,b,l,6,1);
const ico=(r,d)=>new THREE.IcosahedronGeometry(r,d||0);
function RBox(w,h,d,r,seg){
  seg=seg||5;const g=new THREE.BoxGeometry(w,h,d,seg,seg,seg),p=g.attributes.position,n=g.attributes.normal;
  const hx=w/2-r,hy=h/2-r,hz=d/2-r,v=new THREE.Vector3(),c=new THREE.Vector3();
  for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i);c.set(clamp(v.x,-hx,hx),clamp(v.y,-hy,hy),clamp(v.z,-hz,hz));v.sub(c).normalize();
    p.setXYZ(i,c.x+v.x*r,c.y+v.y*r,c.z+v.z*r);n.setXYZ(i,v.x,v.y,v.z);}
  return g;
}
// cabeza con mandíbula: esfera deformada, mentón marcado
function jawGeo(rx,ry,rz,jawK,chinK){
  const g=new THREE.SphereGeometry(1,40,30),p=g.attributes.position;
  for(let i=0;i<p.count;i++){
    let x=p.getX(i),y=p.getY(i),z=p.getZ(i);
    const t=Math.max(0,-y),jaw=Math.pow(t,1.25);
    x*=1-jawK*jaw;z*=1-jawK*0.5*jaw;
    if(y<0)y*=1+chinK*Math.pow(t,1.4);
    if(z>0)z*=1+chinK*0.6*smooth(0.45,0.95,t);
    x*=1+0.07*Math.exp(-Math.pow((y+0.15)/0.28,2));
    p.setXYZ(i,x*rx,y*ry,z*rz);
  }
  g.computeVertexNormals();return g;
}
function surfFn(geo){const sk=new THREE.Mesh(geo);sk.updateMatrixWorld(true);const rc=new THREE.Raycaster();
  return(x,y)=>{rc.set(new THREE.Vector3(x,y,2),new THREE.Vector3(0,0,-1));const h=rc.intersectObject(sk)[0];return h?h.point.z:0.2;};}

/* ---------- materiales (bandas planas) ---------- */
const F=true;
const mSkin=TOON('#b9784f'),mSkinD=TOON('#a1633f'),mSkinF=TOON('#b9784f',{},F),
  mHair=TOON('#3a2a26',{side:THREE.DoubleSide}),
  mWhite=TOON('#fbfaf5'),mBlack=TOON('#17110f'),mMouth=TOON('#5a2a22'),mCheek=TOON('#c9684c',{emissive:'#7a2a1c',emissiveIntensity:.1}),
  mDress=TOON('#ffffff',{map:dotsTex},F),mShirt=TOON('#ffffff',{map:stripe(8)},F),mSleeve=TOON('#ffffff',{map:stripe(3)},F),
  mBow=TOON('#6b2234'),mLegF=TOON('#2f3449',{},F),mShoeF=TOON('#2d2b3e',{},F),mSoleF=TOON('#9a8c9a',{},F),
  mPack=TOON('#6c6a3a'),mPackD=TOON('#5a5830'),mPackL=TOON('#7b7845'),
  // bruixa
  mBlackF=TOON('#3d3339',{},F),mSockF=TOON('#4d5269',{},F),mBootF=TOON('#352d33',{},F),mBootSoleF=TOON('#241d22',{},F),
  mHat=TOON('#41353c'),mHatBand=TOON('#2a2025'),mWicker=TOON('#b98d4e'),mWickerD=TOON('#8f6a37'),mStick=TOON('#7b5337'),mStraw=TOON('#cfa85a'),
  // gato
  mCat=TOON('#4a474f'),mCatL=TOON('#9d949f'),mEyeY=TOON('#e4e23c'),mEarIn=TOON('#c98f8f'),mNose=TOON('#6b4b52'),mCatHat=TOON('#4b3231'),mCatBand=TOON('#2f1f1f'),mWhisk=TOON('#f1ece4'),
  // conill
  mRab=TOON('#c68a46'),mRabD=TOON('#b17335'),mRabL=TOON('#e8c799'),mRabIn=TOON('#ee9d8f'),mRabBow=TOON('#ffffff',{map:bowTex}),mNoseP=TOON('#d98a86');

/* ---------- cabeza de niña (compartida) ---------- */
function buildHead(parent,opt){
  const head=new THREE.Group();parent.add(head);
  const geo=jawGeo(0.29,0.285,0.27,0.40,0.12),surf=surfFn(geo);
  const sk=new THREE.Mesh(geo,mSkin);sk.castShadow=true;head.add(sk);
  [1,-1].forEach(s=>{const e=mk(SPH(0.05,14,10),mSkinD,s*0.305,-0.02,0.02,head);e.scale.set(0.45,1,0.8);});
  const eyes=[];
  [1,-1].forEach(s=>{
    const g=new THREE.Group();g.position.set(s*0.115,-0.03,surf(s*0.115,-0.03)-0.012);head.add(g);
    mk(SPH(0.058,20,14),mWhite,0,0,0,g).scale.z=0.42;
    mk(SPH(0.036,16,12),mBlack,-s*0.003,-0.003,0.018,g).scale.z=0.45;
    eyes.push(g);
    const b=mk(SPH(1,12,8),mHair,s*0.115,0.075,surf(s*0.115,0.075)-0.008,head);b.scale.set(0.042,0.009,0.012);b.rotation.z=-s*0.1;
    const ch=mk(SPH(0.055,14,10),mCheek,s*0.15,-0.1,surf(s*0.15,-0.1)-0.015,head);ch.scale.set(1,0.85,0.25);ch.rotation.y=s*0.6;
  });
  mk(SPH(0.03,14,10),mSkinD,0,-0.085,surf(0,-0.085)-0.004,head).scale.set(1,0.9,1.15);
  {const mo=mk(new THREE.TorusGeometry(0.042,0.009,8,18,Math.PI),mMouth,0,-0.138,surf(0,-0.17)+0.004,head);mo.rotation.set(0.3,0,Math.PI);}
  // pelo
  {const cap=mk(new THREE.SphereGeometry(0.31,32,20,0,Math.PI*2,0,Math.PI*0.56),mHair,0,0,-0.03,head);cap.rotation.x=-0.45;cap.scale.set(1,1,1.03);}
  [[-0.22,0.06],[-0.12,0.08],[0.0,0.09],[0.11,0.08],[0.21,0.06]].forEach(([x,y],i)=>{
    const len=0.055+(i%2)*0.015;
    const m=mk(SPH(1,16,10),mHair,x,y-len*0.25,Math.sqrt(Math.max(0,0.30*0.30-x*x))*0.9,head);
    m.scale.set(0.095,len,0.03);m.rotation.z=(x<0?1:-1)*0.45+(i===2?0.3:0);m.rotation.x=0.3;
  });
  if(!opt.hat)[[-0.05,0.3,-0.1,0.35],[0.07,0.31,-0.12,-0.3]].forEach(([x,y,z,r])=>{const t=mk(SPH(1,10,8),mHair,x,y,z,head);t.scale.set(0.025,0.06,0.025);t.rotation.z=r;t.rotation.x=-0.5;});
  const L=opt.long;
  [1,-1].forEach(s=>{const l=mk(SPH(1,18,14),mHair,s*0.272,L?-0.27:-0.19,-0.07,head);l.scale.set(0.062,L?0.3:0.215,0.075);l.rotation.z=-s*0.05;});
  const hb=new THREE.Group();hb.position.set(0,0.07,-0.12);head.add(hb);
  mk(SPH(1,28,20),mHair,0,L?-0.3:-0.22,0,hb).scale.set(0.3,L?0.5:0.36,0.2);
  if(opt.hat){
    const hat=new THREE.Group();hat.position.set(0,0.1,-0.01);hat.rotation.x=-0.14;head.add(hat);
    mk(new THREE.CylinderGeometry(0.43,0.43,0.022,32),mHat,0,0,0,hat);
    mk(new THREE.CylinderGeometry(0.035,0.325,0.5,28),mHat,0,0.25,0,hat);
    mk(new THREE.CylinderGeometry(0.3,0.33,0.075,28),mHatBand,0,0.06,0,hat);
    const tip=mk(new THREE.ConeGeometry(0.04,0.16,14),mHat,0.035,0.55,0,hat);tip.rotation.z=-0.55;
  }
  return {head,hb,eyes};
}

/* ---------- niña: Bruna / Bruna bruixa ---------- */
const HIP=0.435,Y=y=>y-HIP;
function buildGirl(W){
  const root=new THREE.Group(),rig=new THREE.Group();root.add(rig);
  const legMat=W?mBlackF:mLegF;
  function leg(side){
    const hip=new THREE.Group();hip.position.set(side*0.075,HIP,0);rig.add(hip);
    mk(prismG(0.058,0.05,0.19),legMat,0,-0.095,0,hip);
    const knee=new THREE.Group();knee.position.y=-0.19;hip.add(knee);
    mk(ico(0.05,0),W?mSockF:legMat,0,0,0,knee);
    mk(prismG(0.043,0.036,0.15),W?mSockF:mSkinF,0,-0.075,0,knee);
    const foot=new THREE.Group();foot.position.y=-0.15;knee.add(foot);
    if(W){
      mk(prismG(0.057,0.064,0.11),mBootF,0,0.035,0,foot);
      mk(SPH(0.1,12,8),mBootF,0,-0.04,0.035,foot).scale.set(0.66,0.5,1.2);
      mk(SPH(0.1,12,6),mBootSoleF,0,-0.078,0.035,foot).scale.set(0.68,0.2,1.22);
    }else{
      mk(SPH(0.1,12,8),mShoeF,0,-0.04,0.035,foot).scale.set(0.62,0.45,1.15);
      mk(SPH(0.1,12,6),mSoleF,0,-0.075,0.035,foot).scale.set(0.64,0.2,1.17);
    }
    return {hip,knee,foot};
  }
  const legL=leg(1),legR=leg(-1);
  const upper=new THREE.Group();upper.position.y=HIP;rig.add(upper);
  {const pts=[[0.0001,0.60],[0.10,0.603],[0.138,0.625],[0.145,0.70],[0.145,0.85],[0.137,0.905],[0.105,0.94],[0.065,0.955],[0.0001,0.958]].map(p=>new THREE.Vector2(p[0],p[1]-HIP));
   const t=mk(new THREE.LatheGeometry(pts,10),W?mBlackF:mShirt,0,0,0,upper);t.scale.z=0.86;}
  if(W)mk(new THREE.CylinderGeometry(0.155,0.24,0.62,8,1),mBlackF,0,Y(0.575),0,upper).scale.z=0.84;
  else mk(new THREE.CylinderGeometry(0.152,0.27,0.47,8,1),mDress,0,Y(0.63),0,upper).scale.z=0.82;
  mk(new THREE.CylinderGeometry(0.05,0.056,0.1,12),mSkin,0,Y(0.965),0,upper);
  let pack=new THREE.Group();upper.add(pack);
  if(!W){
    const bow=new THREE.Group();bow.position.set(0,Y(0.80),0.148);upper.add(bow);
    [1,-1].forEach(s=>{const w=mk(SPH(1,14,10),mBow,s*0.048,0,0,bow);w.scale.set(0.05,0.038,0.022);w.rotation.z=s*0.3;});
    mk(SPH(0.02,12,8),mBow,0,0,0.006,bow);

function stepAuto(dt){

function cineCam(dt){

cineReset();cine.snap=true;fade(0.4);
