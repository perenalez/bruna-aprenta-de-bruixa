  S.speed+=clamp(ts-S.speed,-acc*dt,acc*dt);

  camT.x+=(S.pos.x-camT.x)*k;camT.z+=(S.pos.z-camT.z)*k;camT.y+=(S.y+0.72-camT.y)*(1-Math.exp(-dt*3.2));
  const cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch);
  camera.position.set(camT.x+Math.sin(cam.yaw)*cp*cam.dist,camT.y+sp*cam.dist,camT.z+Math.cos(cam.yaw)*cp*cam.dist);
  const g=Math.max(landH(camera.position.x,camera.position.z),WY)+0.25;if(camera.position.y<g)camera.position.y=g;
  camera.lookAt(camT);sky.position.copy(camera.position);
  sun.position.set(camT.x-7,camT.y+13,camT.z+6);sun.target.position.copy(camT);
}
let last=performance.now();
function loop(now){
  const dt=Math.min(0.04,(now-last)/1000);last=now;
  stepMove(dt);animate(dt);updateCam(dt);
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
window.__b={render:()=>renderer.render(scene,camera),step:(n,dt)=>{for(let i=0;i<n;i++){stepMove(dt||1/60);animate(dt||1/60);}updateCam(1);},S,cam,K,input,B,landH,surfAt,parts,get pelvisY(){return pelvisY;}};
})();
</script>
