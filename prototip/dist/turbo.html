<script>
(()=>{
/* ===== 00_motor.js ===== */
const $=id=>document.getElementById(id);

/* ---------- renderer / escena ---------- */
const canvas=$('c');

const scene=new THREE.Scene();
scene.background=new THREE.Color('#1a141f');
const camera=new THREE.PerspectiveCamera(38,1,0.1,200);

const toonGrad=(()=>{const d=new Uint8Array([150,205,255]);const t=new THREE.DataTexture(d,3,1,THREE.LuminanceFormat);t.minFilter=t.magFilter=THREE.NearestFilter;t.generateMipmaps=false;t.needsUpdate=true;return t;})();
const TOON=(c,o,flat)=>{const m=new THREE.MeshLambertMaterial(Object.assign({color:c},o||{}));if(flat)m.flatShading=true;return m;};
const LM=(c,o)=>new THREE.MeshLambertMaterial(Object.assign({color:c},o||{}));

/* ===== 00a_demo.js ===== */
/* Qué versión se monta: 'juego' (mundo completo), 'vuelo' (prueba de la escoba) o 'turbo' (turbo, fruta y setas).
   tools/build.mjs sustituye el marcador por cada versión y genera dist/<versión>.html */
const DEMO='turbo';

/* ===== 01_utilidades.js ===== */
/* ---------- utilidades ---------- */
const mk=(geo,mat,x,y,z,parent)=>{const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=true;if(parent)parent.add(m);return m;};
function canvasTex(w,h,draw,rx,ry){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);t.anisotropy=4;return t;}
const dotsTex=canvasTex(128,128,(g,w,h)=>{g.fillStyle='#e8506a';g.fillRect(0,0,w,h);g.fillStyle='#3a2a3f';[[0,96],[128,96],[64,96],[32,32],[96,32]].forEach(([x,y])=>{g.beginPath();g.arc(x,y,11,0,7);g.fill();});},6,2.5);
const stripe=(ry)=>canvasTex(8,64,(g,w,h)=>{g.fillStyle='#f3efe6';g.fillRect(0,0,w,h/2);g.fillStyle='#464a78';g.fillRect(0,h/2,w,h/2);},1,ry);
const SPH=(r,w,h)=>new THREE.SphereGeometry(r,w||20,h||14);
const prismG=(a,b,l)=>new THREE.CylinderGeometry(a,b,l,6,1);
const ico=(r,d)=>new THREE.IcosahedronGeometry(r,d||0);
function RBox(w,h,d,r,seg){
  seg=seg||5;const g=new THREE.BoxGeometry(w,h,d,seg,seg,seg),p=g.attributes.position,n=g.attributes.normal;
  const hx=w/2-r,hy=h/2-r,hz=d/2-r,v=new THREE.Vector3(),c=new THREE.Vector3();
  for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i);c.set(clamp(v.x,-hx,hx),clamp(v.y,-hy,hy),clamp(v.z,-hz,hz));v.sub(c).normalize();
    p.setXYZ(i,c.x+v.x*r,c.y+v.y*r,c.z+v.z*r);n.setXYZ(i,v.x,v.y,v.z);}
  return g;
}
// cabeza con mandíbula: esfera deformada, mentón marcado
function jawGeo(rx,ry,rz,jawK,chinK){
  const g=new THREE.SphereGeometry(1,40,30),p=g.attributes.position;
  for(let i=0;i<p.count;i++){
    let x=p.getX(i),y=p.getY(i),z=p.getZ(i);
    const t=Math.max(0,-y),jaw=Math.pow(t,1.25);
    x*=1-jawK*jaw;z*=1-jawK*0.5*jaw;
    if(y<0)y*=1+chinK*Math.pow(t,1.4);
    if(z>0)z*=1+chinK*0.6*smooth(0.45,0.95,t);
    x*=1+0.07*Math.exp(-Math.pow((y+0.15)/0.28,2));
    p.setXYZ(i,x*rx,y*ry,z*rz);
  }
  g.computeVertexNormals();return g;
}
function surfFn(geo){const sk=new THREE.Mesh(geo);sk.updateMatrixWorld(true);const rc=new THREE.Raycaster();
  return(x,y)=>{rc.set(new THREE.Vector3(x,y,2),new THREE.Vector3(0,0,-1));const h=rc.intersectObject(sk)[0];return h?h.point.z:0.2;};}

const mRab=TOON('#c68a46'),mRabD=TOON('#b17335'),mRabL=TOON('#e8c799'),mRabIn=TOON('#ee9d8f'),mNoseP=TOON('#d98a86');

/* ===== 02_bosque_escena.js ===== */
/* =====================================================================
   EL BOSQUE DEL LAGO — entorno
   ===================================================================== */
const world=new THREE.Group();scene.add(world);
camera.far=500;
scene.background=new THREE.Color('#40398f');
const FOGC=new THREE.Color('#7667c2');
scene.fog=new THREE.Fog(FOGC,30,150);
const HEMI_OUT=['#c4b6ff','#8a9a66',1.0];hemi.color.set(HEMI_OUT[0]);hemi.groundColor.set(HEMI_OUT[1]);hemi.intensity=HEMI_OUT[2];
sun.color.set('#ffe2f2');sun.intensity=0.5;
Object.assign(sun.shadow.camera,{left:-11,right:11,top:11,bottom:-11,near:1,far:60});sun.shadow.camera.updateProjectionMatrix();

function TRS(x,y,z,rx,ry,rz,sx,sy,sz){
  if(sx===undefined)sx=1;if(sy===undefined)sy=sx;if(sz===undefined)sz=sx;
  return new THREE.Matrix4().compose(new THREE.Vector3(x,y,z),new THREE.Quaternion().setFromEuler(new THREE.Euler(rx||0,ry||0,rz||0)),new THREE.Vector3(sx,sy,sz));
}
const uTime={value:0};
function swayify(m){
  m.onBeforeCompile=sh=>{sh.uniforms.uTime=uTime;
    sh.vertexShader='attribute float sway;\nuniform float uTime;\n'+sh.vertexShader.replace('#include <begin_vertex>',
      '#include <begin_vertex>\n float sw=sin(uTime*1.7+position.x*0.9+position.z*1.3)+0.5*sin(uTime*2.9+position.x*2.1);\n transformed.x+=sw*sway*0.07;transformed.z+=cos(uTime*1.3+position.z*0.8+position.x*0.4)*sway*0.05;');};
  return m;
}
const mLit=swayify(TOON('#ffffff',{vertexColors:true}));
function nearFade(m,d0,d1){const ob=m.onBeforeCompile;m.onBeforeCompile=sh=>{ob(sh);
  sh.fragmentShader=sh.fragmentShader.replace('void main() {','void main() {\n if((1.0/gl_FragCoord.w)<'+d0.toFixed(2)+'+'+d1.toFixed(2)+'*fract(sin(dot(gl_FragCoord.xy,vec2(12.9898,78.233)))*43758.5453))discard;');};return m;}
const mLeaf=nearFade(swayify(TOON('#ffffff',{vertexColors:true})),4.2,1.6);
const mTrunk=nearFade(swayify(TOON('#ffffff',{vertexColors:true})),1.2,0.6);
const mFol=swayify(TOON('#ffffff',{vertexColors:true,side:THREE.DoubleSide}));
const mFlat=swayify(TOON('#ffffff',{vertexColors:true},true));
const mGlow=swayify(new THREE.MeshBasicMaterial({vertexColors:true}));
const mFar=swayify(new THREE.MeshBasicMaterial({vertexColors:true}));
function Batch(){
  const pos=[],nor=[],col=[],sw=[],v=new THREE.Vector3(),c=new THREE.Color(),n3=new THREE.Matrix3();
  const B={base:null,sw:null,
    add(geo,color,x,y,z,rx,ry,rz,sx,sy,sz){
      const g=geo.index?geo.toNonIndexed():geo,m=TRS(x,y,z,rx,ry,rz,sx,sy,sz);
      if(B.base)m.premultiply(B.base);
      n3.getNormalMatrix(m);c.set(color);
      const p=g.attributes.position,n=g.attributes.normal;
      for(let i=0;i<p.count;i++){
        v.fromBufferAttribute(p,i).applyMatrix4(m);pos.push(v.x,v.y,v.z);
        sw.push(B.sw?Math.max(0,v.y-B.sw[0])*B.sw[1]:0);
        v.fromBufferAttribute(n,i).applyMatrix3(n3).normalize();nor.push(v.x,v.y,v.z);
        col.push(c.r,c.g,c.b);
      }
      return B;
    },
    mesh(mat,shadow,parent){
      const g=new THREE.BufferGeometry();
      g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
      g.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));
      g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
      g.setAttribute('sway',new THREE.Float32BufferAttribute(sw,1));
      const me=new THREE.Mesh(g,mat||mLit);me.castShadow=shadow!==false;(parent||world).add(me);return me;
    }};
  return B;
}
const BOX=new THREE.BoxGeometry(1,1,1);
const CYL=n=>new THREE.CylinderGeometry(1,1,1,n||12);
const C5=CYL(5),C6=CYL(6),C10=CYL(10);
const COL=[];
const lerp=(a,b,t)=>a+(b-a)*t;

/* ---------- forma del terreno ---------- */
const POND={x:7.5,z:5.5},WY=-0.2;
const pondR=a=>5.3+0.9*Math.sin(2*a+1)+0.5*Math.sin(3*a+0.5);
function pondD(x,z){const dx=x-POND.x,dz=z-POND.z;return Math.hypot(dx,dz)/pondR(Math.atan2(dx,dz));}
const pathX=z=>{const k=smooth(-34,-10,z);return (-1+1.9*Math.sin(z*0.11+0.3))*k+0.9*Math.sin(z*0.2)*(1-k);};
const OZ=-56,OX=pathX(-47),OY=3.8;const TOWER={x:OX,z:OZ};

/* ===== 03_valle_datos.js ===== */
/* ---------- mundo ampliado: el valle del árbol gigante ---------- */
let WL=WY;
const VC={x:OX+6,z:-80},VRX=36,VRZ=32;
const valE=(x,z)=>Math.hypot((x-VC.x)/VRX,(z-VC.z)/VRZ);
const VF=(x,z)=>1-smooth(0.86,1.02,valE(x,z));
const VH=(x,z)=>OY+0.24*Math.sin(x*0.21+1)*Math.cos(z*0.17)+0.12*Math.sin(x*0.47+z*0.33)+0.7*smooth(0.6,0.98,valE(x,z));
const RX=z=>OX-23+2.5*Math.sin(z*0.07+1)+1.2*Math.sin(z*0.16+2),RW=2.6,WR=OY-0.55;
const BZ=-74,RXB=RX(BZ),BL=RW+2.3;
const deckY=x=>OY+0.12+0.45*Math.cos(Math.PI/2*clamp((x-RXB)/BL,-1,1));
const GT={x:OX+3,z:-91,y:0},CAVE_RIN=3.6,CAVE_ROUT=6.3,TUN=1.35;GT.y=VH(GT.x,GT.z);
const TH={x:OX+18,z:-104};
function mkHouse(x,z,w,d,h,fx,fz,big){const H={x,z,w,d,h,big,y:VH(x,z),yaw:Math.atan2(fx-x,fz-z),inside:false};H.c=Math.cos(H.yaw);H.s=Math.sin(H.yaw);return H;}
const hW=(H,lx,lz)=>[H.x+lx*H.c+lz*H.s,H.z-lx*H.s+lz*H.c];
const hL=(H,x,z)=>{const dx=x-H.x,dz=z-H.z;return [dx*H.c-dz*H.s,dx*H.s+dz*H.c];};
const H1=mkHouse(OX+26,-68,7,5.6,3.1,OX+9,-62,true),H2=mkHouse(OX+30,-87,5.4,4.6,2.8,OX+18,-80,false);
const HOUSES=[H1,H2];
const GARDEN=(()=>{const p=hW(H1,H1.w/2+3.3,0.3);return {x:p[0],z:p[1]};})();
const PADS=[{x:H1.x,z:H1.z,r:Math.hypot(H1.w,H1.d)/2+1.3,y:H1.y},{x:GARDEN.x,z:GARDEN.z,r:3.9,y:H1.y},{x:H2.x,z:H2.z,r:Math.hypot(H2.w,H2.d)/2+1.3,y:H2.y}];
const PATHS=[],addP=pts=>PATHS.push(pts);
addP([[OX+0.5,-46.5],[OX+8,-52],[OX+9.5,-62],[OX+6,-71]]);
addP([[OX+6,-71],[OX+4.5,-79],[GT.x,GT.z+8],[GT.x,GT.z+3]]);
addP([[OX+6,-71],[OX-4,-73],[OX-12,-74.6],[RXB+BL+0.6,BZ]]);
addP([[RXB-BL-0.6,BZ],[RXB-BL-2,BZ-8],[RX(-100)-5.5,-100],[RX(-116)-5.5,-116]]);
addP([[OX+9.5,-62],[OX+16,-65],hW(H1,0,H1.d/2+1.3)]);
addP([[OX+16,-65],[OX+19,-77],hW(H2,0,H2.d/2+1.3)]);
function distSeg(px,pz,ax,az,bx,bz){const vx=bx-ax,vz=bz-az,t=clamp(((px-ax)*vx+(pz-az)*vz)/(vx*vx+vz*vz),0,1);return Math.hypot(px-ax-vx*t,pz-az-vz*t);}
function distPaths(x,z){let m=1e9;for(const P of PATHS)for(let i=0;i<P.length-1;i++){const d=distSeg(x,z,P[i][0],P[i][1],P[i+1][0],P[i+1][1]);if(d<m)m=d;}return m;}
function extraH(x,z,h){
  const e=valE(x,z);
  if(e<1.12)h=lerp(VH(x,z),h,smooth(0.9,1.12,e));
  if(z<-34){const dr=Math.abs(x-RX(z));if(dr<RW+2.6){const k=smooth(-36,-44,z);h=lerp(h,lerp(WR-1.05,h,smooth(RW*0.45,RW+2.5,dr)),k);}}
  for(const p of PADS){const d=Math.hypot(x-p.x,z-p.z);if(d<p.r+3)h=lerp(p.y,h,smooth(p.r,p.r+3,d));}
  const dg=Math.hypot(x-GT.x,z-GT.z);if(dg<15)h=lerp(GT.y,h,smooth(8,15,dg));
  return h;
}
const C_PATH=new THREE.Color('#c6b862'),C_SOIL=new THREE.Color('#4a3a3a'),C_CAVE=new THREE.Color('#2e2632'),C_BANK=new THREE.Color('#6a6488'),C_BED=new THREE.Color('#3d3a70'),C_VAL=new THREE.Color('#7a9a55');
function extraC(x,z,h,c){
  const vf=VF(x,z);
  if(vf>0){const n=0.5+0.5*Math.sin(x*0.27+1.7*Math.sin(z*0.19))*Math.cos(z*0.23+Math.sin(x*0.13));c.lerp(C_VAL,vf*0.4*n);}
  const dp=distPaths(x,z);if(dp<2.4)c.lerp(C_PATH,(1-smooth(0.8,1.85,dp+0.25*Math.sin(x*1.3+z)))*0.9);
  if(z<-34){const dr=Math.abs(x-RX(z));if(dr<RW+3.4){c.lerp(C_BANK,(1-smooth(RW+1,RW+3.4,dr))*0.7);c.lerp(C_BED,1-smooth(RW*0.5,RW+0.6,dr));}}
  const dg=Math.hypot(x-GT.x,z-GT.z);if(dg<9.5){c.lerp(C_SOIL,(1-smooth(6.4,9.5,dg))*0.8);c.lerp(C_CAVE,1-smooth(3.2,3.9,dg));}
  for(const H of HOUSES){const l=hL(H,x,z);if(Math.abs(l[0])<H.w/2+0.9&&Math.abs(l[1])<H.d/2+0.9)c.lerp(C_SOIL,0.45);}
  return c;
}

function taperTube(pts,r0,r1,rs,N){

  for(let i=0;i<N;i++)for(let j=0;j<rs;j++){const a=i*rs+j,b=i*rs+(j+1)%rs,c=a+rs,d=b+rs;idx.push(a,c,b,b,c,d);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setIndex(idx);g.computeVertexNormals();
  const p0=curve.getPointAt(0),nx=g.attributes.normal.getX(0),ny=g.attributes.normal.getY(0),nz=g.attributes.normal.getZ(0);
  if(nx*(pos[0]-p0.x)+ny*(pos[1]-p0.y)+nz*(pos[2]-p0.z)<0){for(let i=0;i<idx.length;i+=3){const t=idx[i+1];idx[i+1]=idx[i+2];idx[i+2]=t;}g.setIndex(idx);g.computeVertexNormals();}
  return {g,curve};
}

const okSpot=(x,z,cl)=>{
  if(distPaths(x,z)<cl+1.2)return false;
  if(Math.hypot(x-OX,z-OZ)<20)return false;
  if(Math.hypot(x-GT.x,z-GT.z)<17)return false;
  if(Math.hypot(x-TH.x,z-TH.z)<6)return false;
  for(const p of PADS)if(Math.hypot(x-p.x,z-p.z)<p.r+cl+1.5)return false;
  if(z<-34&&Math.abs(x-RX(z))<RW+cl+1.5)return false;
  if(Math.abs(z-BZ)<cl+4&&Math.abs(x-RXB)<BL+cl+3)return false;
  return true;
};

  else{const s=(p-duty)/(1-duty);out.z=SL*(-0.5+ease(s))-run*0.12*Math.sin(s*PI)*(1-s);out.y=lift*Math.pow(Math.sin(PI*Math.pow(s,0.8)),0.9)+0.04*(1-s)*(1-s);
    out.pitch=0.75*(1-s)*(1-s)+run*0.5*Math.sin(s*PI)*(1-s)-0.42*s*s*s*(1-run*0.7);out.c=false;}
}

/* =====================================================================
   POCIONES — el esqueleto del juego del nivel 1
   - Partida guardada en el navegador (GS) y poderes (POW)
   - Sonido: música misteriosa y un sonidito por acción (Web Audio, sin archivos)
   - Libreta (receta, diario, chat con el Conillet), saco, libro de conjuros, caldero
   - Conillet: la cola parpadea con cada mensaje y, si lo pides, te guía (brilla y salta cerca)
   - Varita: despliega un botón por conjuro aprendido (Sol, Lluvia)
   - Poción 1 (Arcoíris) jugable de principio a fin
   Los datos (ingredientes, textos) están en 54_datos_pociones.js.
   ===================================================================== */

  if(GS.phase==='fin1')GS.phase='fin';                                          // partidas guardadas con la versión anterior

/* ---------- SONIDO ---------- */
const AU={ctx:null,on:true,noise:null};
try{AU.on=localStorage.getItem('bruna-sonido')!=='0';}catch(e){}
function audioInit(){
  if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume();return;}
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  const c=new C();AU.ctx=c;
  AU.master=c.createGain();AU.master.gain.value=AU.on?1:0;AU.master.connect(c.destination);
  AU.fx=c.createGain();AU.fx.gain.value=0.8;AU.fx.connect(AU.master);
  AU.mus=c.createGain();AU.mus.gain.value=0.5;AU.mus.connect(AU.master);
  // eco suave para la música
  const dl=c.createDelay(1),fb=c.createGain(),lp=c.createBiquadFilter();dl.delayTime.value=0.39;fb.gain.value=0.38;lp.type='lowpass';lp.frequency.value=1800;
  AU.mus.connect(dl);dl.connect(lp);lp.connect(fb);fb.connect(dl);lp.connect(AU.master);
  const b=c.createBuffer(1,c.sampleRate,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;AU.noise=b;
  MUS.next=c.currentTime+0.3;setInterval(musicTick,60);
}
['pointerdown','keydown','touchstart'].forEach(ev=>addEventListener(ev,audioInit,{capture:true,passive:true}));
document.addEventListener('visibilitychange',()=>{if(!AU.ctx)return;if(document.hidden)AU.ctx.suspend();else AU.ctx.resume();});
function setSound(on){AU.on=on;try{localStorage.setItem('bruna-sonido',on?'1':'0');}catch(e){}if(AU.master)AU.master.gain.setTargetAtTime(on?1:0,AU.ctx.currentTime,0.05);$('bsnd').classList.toggle('off',!on);}
function tone(f,t0,dur,o){o=o||{};const c=AU.ctx,os=c.createOscillator(),g=c.createGain();os.type=o.type||'sine';os.frequency.setValueAtTime(f,t0);
  if(o.to)os.frequency.exponentialRampToValueAtTime(o.to,t0+dur);if(o.detune)os.detune.value=o.detune;const v=o.vol||0.2,a=o.attack||0.005;
  g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+a);g.gain.exponentialRampToValueAtTime(0.0001,t0+Math.max(dur,a+0.02));
  os.connect(g);g.connect(o.dest||AU.fx);os.start(t0);os.stop(t0+dur+0.05);}
function noise(t0,dur,o){o=o||{};const c=AU.ctx,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=AU.noise;s.loop=true;

function sfx(name,k){
  if(!AU.ctx||!AU.on)return;const t=AU.ctx.currentTime+0.01;k=k===undefined?1:k;

    case 'jump':tone(300,t,0.2,{to:600,type:'triangle',vol:0.1});break;
    case 'land':noise(t,0.12,{freq:260,type:'lowpass',vol:0.08+0.14*k});if(k>0.3)tone(110,t,0.12,{to:55,vol:0.12*k});break;

    case 'lift':tone(70,t,1.4,{type:'triangle',vol:0.1,attack:0.25});arp(t+0.1,[523,659,784],0.09,{vol:0.05,dur:0.4,type:'triangle'});break;

    case 'eat':tone(660,t,0.08,{vol:0.12});tone(990,t+0.07,0.1,{vol:0.1});break;

    case 'sun':tone(392,t,1.4,{type:'triangle',vol:0.07,attack:0.3});tone(587,t+0.1,1.3,{type:'triangle',vol:0.05,attack:0.3});arp(t+0.2,[784,988,1175,1568],0.08,{vol:0.05,dur:0.5});break;
    case 'rain':noise(t,3.5,{freq:4000,type:'highpass',vol:0.06,attack:0.5});for(let i=0;i<12;i++)noise(t+0.3+Math.random()*3,0.03,{freq:2500+Math.random()*2000,q:3,vol:0.04});break;

function potionActions(){
  if(!PLAY||dOn||flying||stirOn)return null;
  const ph=GS.phase,busy=ph==='recoger'||ph==='caldero';
  // cosas que se recogen (en el torreón o en el bosque)
  if(busy){
    for(const id in POTS){const p=POTS[id];if(GS.got[id]||!p.g.visible||!inPot(id))continue;if(p.ing.spot&&p.ing.spot.type==='ward'&&!GS.wardOpen)continue;
      p.g.getWorldPosition(_w);const dx=_w.x-S.pos.x,dz=_w.z-S.pos.z,dy=_w.y-S.y;
      if(Math.hypot(dx,dz)<1.45&&dy>-0.6&&dy<2.3){ctxPot=p;ctxCap=p.ing.nombre;ctxA.set(_w.x,_w.y+0.9,_w.z);return ['coger'];}}
    const ex=potionExtraActions();if(ex)return ex;            // acciones complejas de cada poción (56_pocion2.js…)
  }
  if(mode!=='tower')return null;
  const l=toLoc(S.pos.x,S.pos.z,S.y),lx=l.x,lz=l.z,ly=l.y;
  // armario de Bruna
  if(Math.abs(ly-L(1))<0.6){_w.setFromMatrixPosition(WARD_M.clone().multiply(TRS(0,0,0.9)));
    if(Math.hypot(lx-_w.x,lz-_w.z)<1.7){ctxCap='Armari';ctxA.set(_w.x+OX,OY+L(1)+2.6,_w.z+OZ);
      if(!GS.wardOpen)return ['armario'];
      if(ph==='premio'&&!REWARD[POT().premio.ropa].noWard){LAB.ponerse=REWARD[POT().premio.ropa].lab;return ['ponerse'];}}}
  // libro
  if(ph!=='inicio'&&Math.abs(ly-L(2))<0.6&&Math.hypot(lx-BOOK.x,lz-BOOK.z)<1.8){ctxCap='Llibre de conjurs';ctxA.set(BOOK.x+OX,BOOK.y+OY+0.9,BOOK.z+OZ);return ['leer'];}
  // caldero
  if(Math.abs(ly-L(2))<0.6&&Math.hypot(lx-KC.x,lz-KC.z)<2.3){
    ctxA.set(KC.x+OX,OY+L(2)+2.2,KC.z+OZ);
    if(busy&&GS.bag.some(inPot)&&GS.layers.length<5){ctxCap='Calder · '+GS.layers.length+'/5';return ['echar'];}
    if(ph==='remover'){ctxCap='Calder';return ['remover'];}}
  return null;
}

  ov.innerHTML='<div id="stirBox"><p>'+TXT.remover+'</p><div id="stirPot"><div id="stirLiq"></div><div id="stirSpoon"></div></div><div id="stirBar"><i></i></div></div>';
  ov.classList.add('on');const pot=$('stirPot'),liq=$('stirLiq'),sp=$('stirSpoon'),bar=ov.querySelector('#stirBar i');
  const cols=GS.layers.map(id=>findIng(id).color);liq.style.background='conic-gradient('+cols.map((c,i)=>c+' '+(i*20)+'% '+((i+1)*20)+'%').join(',')+')';
  const ang=e=>{const r=pot.getBoundingClientRect();return Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2));};
  const mv=e=>{if(!stirOn)return;const a=ang(e);if(last!==null){let d=a-last;if(d>PI)d-=TAU;if(d<-PI)d+=TAU;turns+=Math.abs(d);

    last=a;const u=Math.min(1,turns/need);bar.style.width=(u*100)+'%';liq.style.transform='rotate('+(turns*57.3)+'deg)';sp.style.transform='rotate('+(a*57.3+90)+'deg)';
    liq.style.filter='saturate('+(1-u*0.5)+')';liq.style.boxShadow='inset 0 0 0 999px '+c0+Math.round(u*255).toString(16).padStart(2,'0');

  const finish=()=>{if(!stirOn)return;stirOn=false;ov.removeEventListener('pointermove',mv);setTimeout(()=>{ov.classList.remove('on');mixCauldron(c0);potionDone();},500);};
  ov.addEventListener('pointerdown',e=>{last=ang(e);});ov.addEventListener('pointermove',mv);

}

let tAcc=0,guideBand=-1;
function gameStep(dt){
  tAcc+=dt;const t=S.t;
  // armario
  ward.open+=((GS.wardOpen?1:0)-ward.open)*(1-Math.exp(-dt*4));for(const d of ward.doors)d.h.rotation.y=d.s*ward.open*1.9;
  // cosas recogibles: flotan y brillan (las de la poción en curso, más)
  const busy=GS.phase==='recoger'||GS.phase==='caldero';
  for(const id in POTS){const p=POTS[id];if(!p.g.visible)continue;
    if(!p.nobob){p.g.position.y=p.g.userData.by+0.03+Math.sin(t*2+id.length)*0.025;p.g.rotation.y=t*0.6;}
    if(p.g.userData.halo)p.g.userData.halo.material.opacity=busy&&inPot(id)?0.35+0.2*Math.sin(t*3):0.08;}
  // libro: brilla mientras toca leerlo
  bookGlow.material.opacity=GS.phase==='leer'?0.45+0.25*Math.sin(t*3):0;
  // premios: en el armario cuando toca
  const rw=GS.phase==='premio'?POT().premio.ropa:null;
  for(const k in REWARD){const R=REWARD[k];if(R.noWard)continue;R.w.visible=k===rw;if(R.w.visible)R.w.rotation.y=PI+0.05+Math.sin(t)*0.2;}
  hatB.visible=GS.clothes.includes('barret');
  // bote volando al caldero
  if(flying){flying.t+=dt/0.7;const u=Math.min(1,flying.t);flying.g.position.lerpVectors(flying.from,flying.to,u);flying.g.position.y+=Math.sin(u*PI)*1.2;flying.g.rotation.z=u*8;
